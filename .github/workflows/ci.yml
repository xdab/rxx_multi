name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-rtl:
    # RTL backend only: librtlsdr installs from apt, while the RSP backend
    # needs the SDRplay API tarball. The core is byte-identical across
    # backends and -I bypasses the device, so RTL covers the shared code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make librtlsdr-dev libliquid-dev
      - name: Build rtl_multi
        run: make rtl

  regression:
    # Hardware-free demodulation gate: tools/regression.py synthesizes a
    # multi-channel scene, demodulates it via -I file input and checks each
    # channel's output mechanically (tone frequency, rejection). Same scope
    # rationale as build-rtl: RTL binary, no RSP.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make librtlsdr-dev libliquid-dev
          pip install numpy
      - name: Build rtl_multi
        run: make rtl
      - name: Regression suite
        run: python3 tools/regression.py

  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          # .clang-format uses clang-format 22+ keys, so pin to the version
          # the project is formatted with
          pip install clang-format==23.1.3 ruff
      - name: Style check
        run: make fmt-check

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          # clang-tidy only parses (doesn't link), but types.h pulls in
          # <liquid/liquid.h> and the RTL backend needs rtl-sdr.h; RSP is out
          # of scope (no SDRplay header in CI)
          sudo apt-get install -y librtlsdr-dev libliquid-dev
          # Same LLVM pin as the fmt-check job's clang-format: the version
          # the project is analyzed with
          pip install clang-tidy==23.1.3
      - name: Static analysis
        run: make tidy
